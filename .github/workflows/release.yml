name: Release

on:
  push:
    tags:
      - "*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Validate SemVer tag
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z]*)(\.(0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z]*))*))?$'
          if [[ ! "$tag" =~ $semver ]]; then
            echo "Refusing non-SemVer tag: $tag"
            echo "Use MAJOR.MINOR.PATCH or MAJOR.MINOR.PATCH-prerelease, without a v prefix."
            exit 1
          fi

      - name: Set project version from tag
        working-directory: unique-attribute-validator-provider
        run: mvn -B versions:set -DnewVersion="${GITHUB_REF_NAME}" -DgenerateBackupPoms=false

      - name: Build release JAR
        working-directory: unique-attribute-validator-provider
        run: mvn -B clean verify

      - name: Validate demo Keycloak image
        run: docker build .

      - name: Publish release package
        working-directory: unique-attribute-validator-provider
        run: mvn -B deploy -DskipTests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Stage release asset
        run: cp unique-attribute-validator-provider/target/unique-attribute-validator-provider-*.jar unique-attribute-validator-provider.jar

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: unique-attribute-validator-provider.jar
          generate_release_notes: true
